<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DukaFlow Insights</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="top"><h1>📊 DukaFlow Insights</h1></div>
<p id="m">⏳ Loading...</p>
<div id="k" class="hid"></div>
<div class="kpis">
<div class="kpi"><b id="k1">0</b><span>Revenue UGX</span></div>
<div class="kpi"><b id="k2">0</b><span>Shops</span></div>
<div class="kpi"><b id="k3">0</b><span>Sales</span></div>
<div class="kpi"><b id="k4">0</b><span>Est. Profit</span></div>
</div>
<div class="tabs">
<button class="tb on" onclick="tab(1)">📈 Overview</button>
<button class="tb" onclick="tab(2)">🏪 Shops</button>
<button class="tb" onclick="tab(3)">⚙️ Admin</button>
</div>
<div id="p1" class="pg">
<div class="card"><h3>📈 14-Day Revenue</h3><canvas id="ch"></canvas></div>
<div class="card"><h3>🏆 Top Products</h3><div id="tp"></div></div>
<div class="card"><h3>💳 Payment Mix</h3><div id="pm"></div></div>
<div class="card"><h3>🛒 Latest Sales</h3><div id="s"></div></div>
</div>
<div id="p2" class="pg hid">
<div class="card"><h3>🏪 Shop Report Cards</h3><div id="sh"></div></div>
</div>
<div id="p3" class="pg hid">
<div class="card"><h3>🗑️ Delete Bad Sales</h3><div id="ds"></div></div>
<div class="card"><h3>⛔ Remove Shops</h3><div id="rs"></div></div>
</div>
<script src="app1.js"></script>
<script src="app2.js"></script>
<script>
function tab(n){
for(var i=1;i<4;i++){
var p=document.getElementById('p'+i);
if(p){p.className=(i==n)?'pg':'pg hid';}}
var b=document.getElementsByClassName('tb');
for(var j=0;j<b.length;j++){
b[j].className=(j==n-1)?'tb on':'tb';}}
function shopsList(){
var h='';
H.forEach(function(x){
var c=0,v=0;
S.forEach(function(y){
if(y.shop_id==x.id){c++;v+=amt(y);}});
h+='<div class="shop"><b>'+sname(x)+
'</b> · '+c+' sales · UGX '+
v.toLocaleString()+'<br><small>'+
(x.owner_name||'')+'</small></div>';});
document.getElementById('sh').innerHTML=
h||'<p>No shops yet.</p>';}
function adminLists(){
var d='';
S.slice(0,15).forEach(function(x){
d+='<div class="row"><span>'+nm(x.shop_id)+
' · '+(x.product_name||'Item')+
'</span><button class="act" onclick="dR(\''+
x.id+'\')">Del</button></div>';});
document.getElementById('ds').innerHTML=
d||'<p>No sales.</p>';
var r='';
H.forEach(function(x){
r+='<div class="row"><span>'+sname(x)+
'</span><button class="act" onclick="dS(\''+
x.id+'\',\''+esc(sname(x))+
'\')">Remove</button></div>';});
document.getElementById('rs').innerHTML=
r||'<p>No shops.</p>';}
async function dS(i,n){
if(!confirm('Remove '+n+' and ALL its data?'))return;
await sb.from('sales').delete().eq('shop_id',i);
await sb.from('expenses').delete().eq('shop_id',i);
var r=await sb.from('shops').delete().eq('id',i);
alert(r.error?r.error.message:'✅ removed');
location.reload();}
async function dR(i){
if(!confirm('Delete this sale?'))return;
var r=await sb.from('sales').delete().eq('id',i);
alert(r.error?r.error.message:'✅ deleted');
location.reload();}
</script>
</body>
</html>
