<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DukaFlow Insights</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div id="mpl" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0d1117;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;">
<h2>DukaFlow Insights</h2>
<p style="color:#8b949e;">Enter Master PIN</p>
<input type="password" id="mpl-in" maxlength="4" placeholder="****" style="padding:15px;font-size:24px;text-align:center;letter-spacing:10px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#fff;width:200px;margin-bottom:20px;">
<button onclick="mplGo()" style="padding:12px 30px;background:#238636;color:#fff;border:none;border-radius:8px;font-size:16px;">Unlock</button>
<div id="mpl-err" style="color:#f85149;margin-top:15px;"></div>
</div>
<script>
var MPL_PIN='2026';
function mplGo(){
var v=document.getElementById('mpl-in').value;
if(v===MPL_PIN){
sessionStorage.setItem('mpl_ok','1');
document.getElementById('mpl').style.display='none';
document.body.style.overflow='auto';
if(typeof show==='function'){show();}
}else{
document.getElementById('mpl-err').textContent='Wrong PIN';
document.getElementById('mpl-in').value='';
}
}
if(sessionStorage.getItem('mpl_ok')==='1'){
document.getElementById('mpl').style.display='none';
}else{
document.body.style.overflow='hidden';
}
document.getElementById('mpl-in').addEventListener('keypress',function(e){
if(e.key==='Enter'){mplGo();}
});
</script>
<div class="top"><h1>📊 DukaFlow Insights</h1></div>
<p id="m">⏳ Loading...</p>
<div id="k" class="hid"></div>
<div class="kpis">
<div class="kpi"><b id="k1">0</b><span>Revenue UGX</span></div>
<div class="kpi"><b id="k2">0</b><span>Shops</span></div>
<div class="kpi"><b id="k3">0</b><span>Sales</span></div>
<div class="kpi"><b id="k4">0</b><span>Est. Profit</span></div>
</div>
<div class="tabs">
<button class="tb on" onclick="tab(1)">📈 Overview</button>
<button class="tb" onclick="tab(2)">🏪 Shops</button>
<button class="tb" onclick="tab(3)">⚙️ Admin</button>
</div>
<div id="p1" class="pg">
<div class="card"><h3>📈 14-Day Revenue</h3><canvas id="ch"></canvas></div>
<div class="card"><h3>🏆 Top Products</h3><div id="tp"></div></div>
<div class="card"><h3>💳 Payment Mix</h3><div id="pm"></div></div>
<div class="card"><h3>🛒 Latest Sales</h3><div id="s"></div></div>
</div>
<div id="p2" class="pg hid">
<div class="card"><h3>🏪 Shop Performance</h3><div id="sh"></div></div>
</div>
<div id="p3" class="pg hid">
<div class="card"><h3>🗑️ Delete Bad Sales</h3><div id="ds"></div></div>
<div class="card"><h3>⛔ Remove Shops</h3><div id="rs"></div></div>
</div>
<script src="app1.js"></script>
<script src="app2.js"></script>
<script>
var E=[];
addEventListener('load',function(){fe();});
async function fe(){
if(!window.sb){setTimeout(fe,800);return;}
try{
var r=await sb.from('expenses').select('*');
E=r.data||[];
shopsList();
}catch(e){setTimeout(fe,3000);}
}
function eamt(x){
return Number(x.amount||x.total_amount||
x.cost||x.value||0)||0;
}
function tab(n){
for(var i=1;i<4;i++){
var p=document.getElementById('p'+i);
if(p){p.className=(i==n)?'pg':'pg hid';}}
var b=document.getElementsByClassName('tb');
for(var j=0;j<b.length;j++){
b[j].className=(j==n-1)?'tb on':'tb';}}
function shopsList(){
var h='';
H.forEach(function(x){
var c=0,v=0,ex=0;
S.forEach(function(y){
if(y.shop_id==x.id){c++;v+=amt(y);}});
E.forEach(function(y){
if(y.shop_id==x.id){ex+=eamt(y);}});
h+='<div class="shop"><b>'+sname(x)+'</b>'+
'<div class="row"><span>🛒 '+c+
' sales</span><b>UGX '+v.toLocaleString()+
'</b></div>'+
'<div class="row"><span>💸 expenses</span><b>UGX '+
ex.toLocaleString()+'</b></div>'+
'<div class="row"><span>📊 money left</span><b>UGX '+
(v-ex).toLocaleString()+'</b></div>'+
'<small>'+(x.owner_name||'')+'</small></div>';});
document.getElementById('sh').innerHTML=
h||'<p>No shops yet.</p>';}
function adminLists(){
var d='';
S.slice(0,15).forEach(function(x){
d+='<div class="row"><span>'+nm(x.shop_id)+
' · '+(x.product_name||'Item')+
'</span><button class="act" onclick="dR(\''+
x.id+'\')">Del</button></div>';});
document.getElementById('ds').innerHTML=
d||'<p>No sales.</p>';
var r='';
H.forEach(function(x){
r+='<div class="row"><span>'+sname(x)+
'</span><button class="act" onclick="dS(\''+
x.id+'\',\''+esc(sname(x))+
'\')">Remove</button></div>';});
document.getElementById('rs').innerHTML=
r||'<p>No shops.</p>';}
async function dS(i,n){
if(!confirm('Remove '+n+' and ALL its data?'))return;
await sb.from('sales').delete().eq('shop_id',i);
await sb.from('expenses').delete().eq('shop_id',i);
var r=await sb.from('shops').delete().eq('id',i);
alert(r.error?r.error.message:'✅ removed');
location.reload();}
async function dR(i){
if(!confirm('Delete this sale?'))return;
var r=await sb.from('sales').delete().eq('id',i);
alert(r.error?r.error.message:'✅ deleted');
location.reload();}
</script>
</body>
</html>
