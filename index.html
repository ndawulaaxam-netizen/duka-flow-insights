<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DukaFlow Insights</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
#pin{position:fixed;inset:0;background:#0f172a;display:flex;align-items:center;justify-content:center;z-index:99}
.pcard{background:#1e293b;padding:24px;border-radius:16px;width:80%;max-width:320px;text-align:center}
.pcard input{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:18px;text-align:center;margin-bottom:10px;box-sizing:border-box}
.rb{flex:1;background:#1e293b;color:#94a3b8;border:0;border-radius:10px;padding:8px;font-weight:700}
.rb.on{background:#16a34a;color:#fff}
</style>
</head>
<body>
<div id="pin">
<div class="pcard">
<h2>🔒 Founder PIN</h2>
<input id="pw" type="password" inputmode="numeric" placeholder="4-digit PIN">
<button class="go" onclick="unlock()">Unlock</button>
<p id="pe" style="color:#f87171"></p>
</div>
</div>
<div id="app" class="hid">
<div class="top"><h1>📊 DukaFlow Insights</h1></div>
<p id="m">⏳ Loading...</p>
<div class="tabs">
<button class="rb on" data-d="0" onclick="setRange(0)">All</button>
<button class="rb" data-d="1" onclick="setRange(1)">Today</button>
<button class="rb" data-d="7" onclick="setRange(7)">7 Days</button>
<button class="rb" data-d="30" onclick="setRange(30)">30 Days</button>
</div>
<div class="kpis">
<div class="kpi"><b id="k1">0</b><span>Revenue UGX</span></div>
<div class="kpi"><b id="k2">0</b><span>Shops</span></div>
<div class="kpi"><b id="k3">0</b><span>Sales</span></div>
<div class="kpi"><b id="k4">0</b><span>Est. Profit</span></div>
</div>
<div class="tabs">
<button class="tb on" onclick="tab(1)">📈 Overview</button>
<button class="tb" onclick="tab(2)">🏪 Shops</button>
<button class="tb" onclick="tab(3)">⚙️ Admin</button>
</div>
<div id="p1" class="pg">
<div class="card"><h3>📈 14-Day Revenue</h3><canvas id="ch"></canvas></div>
<div class="card"><h3>🏆 Top Products</h3><div id="tp"></div></div>
<div class="card"><h3>📍 Region Ranking</h3><div id="rg"></div></div>
<div class="card"><h3>💳 Payment Mix</h3><div id="pm"></div></div>
<div class="card"><h3>📦 Restock Alerts</h3><div id="ra"></div></div>
<div class="card"><h3>🛒 Latest Sales</h3><div id="s"></div></div>
</div>
<div id="p2" class="pg hid">
<div class="card"><h3>🧾 Money Truth</h3><div id="ev"></div></div>
<div class="card"><h3>🏪 Shop Report Cards</h3><div id="sh"></div></div>
</div>
<div id="p3" class="pg hid">
<div class="card"><h3>📥 Factory Report (anonymized)</h3>
<button class="go" onclick="exp()">📥 Download CSV</button></div>
<div class="card"><h3>🗑️ Delete Bad Sales</h3><div id="ds"></div></div>
<div class="card"><h3>⛔ Remove Shops</h3><div id="rs"></div></div>
</div>
</div>
<script>
var PIN='2026';
function unlock(){
if(document.getElementById('pw').value===PIN){
sessionStorage.setItem('dfok','1');
openDash();
}else{
document.getElementById('pe').innerText='Wrong PIN. Try again.';
}
}
function openDash(){
document.getElementById('pin').style.display='none';
document.getElementById('app').className='';
}
if(sessionStorage.getItem('dfok')==='1'){openDash();}
</script>
<script src="app1.js"></script>
<script src="app2.js"></script>
<script src="app3.js"></script>
<script src="app4.js"></script>
</body>
</html>
