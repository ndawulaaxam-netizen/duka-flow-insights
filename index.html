<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DukaFlow Insights</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="top"><h1>📊 DukaFlow Insights</h1></div>
<p id="m">⏳ Loading...</p>
<div id="k" class="hid"></div>
<div class="kpis">
<div class="kpi"><b id="k1">0</b><span>Revenue UGX</span></div>
<div class="kpi"><b id="k2">0</b><span>Shops</span></div>
<div class="kpi"><b id="k3">0</b><span>Sales</span></div>
<div class="kpi"><b id="k4">0</b><span>Est. Profit</span></div>
</div>
<div class="tabs">
<button class="tb on" onclick="tab(1)">📈 Overview</button>
<button class="tb" onclick="tab(2)">🏪 Shops</button>
<button class="tb" onclick="tab(3)">⚙️ Admin</button>
</div>
<div id="p1" class="pg">
<div class="card"><h3>📈 14-Day Revenue</h3><canvas id="ch"></canvas></div>
<div class="card"><h3>🏆 Top Products</h3><div id="tp"></div></div>
<div class="card"><h3>💳 Payment Mix</h3><div id="pm"></div></div>
<div class="card"><h3>🛒 Latest Sales</h3><div id="s"></div></div>
</div>
<div id="p2" class="pg hid">
<div class="card"><h3>🏪 Shop Report Cards</h3><div id="sh"></div></div>
</div>
<div id="p3" class="pg hid">
<div class="card"><h3>📥 Factory Report (anonymized)</h3>
<button class="go" onclick="exp()">📥 Download CSV</button></div>
<div class="card"><h3>🗑️ Delete Bad Sales</h3><div id="ds"></div></div>
<div class="card"><h3>⛔ Remove Shops</h3><div id="rs"></div></div>
</div>
<script src="app1.js"></script>
<script src="app2.js"></script>
<script src="app3.js"></script>
</body>
</html>
