<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DukaFlow Insights</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:sans-serif;background:#f1f5f9;margin:0;padding:14px}
#m{background:#eff6ff;border-left:4px solid #2563eb;padding:10px;border-radius:6px}
.w{background:#fff;border-radius:10px;padding:10px;margin:8px 0}
button{background:#ef4444;color:#fff;border:0;border-radius:6px;padding:6px 10px}
</style>
</head>
<body>
<h2>📊 DukaFlow Insights v9</h2>
<p id="m">⏳ Loading v9...</p>
<div class="w" id="k"></div>
<div class="w">
<h3>🛒 Sales (Del = delete bad record)</h3>
<div id="s"></div>
</div>
<div class="w">
<h3>🏪 Shops (Remove = delete shop)</h3>
<div id="h"></div>
</div>
<script src="app1.js"></script>
<script>
function amt(x){
var v=Number(x.total_amount||x.amount||x.total||x.sale_amount||x.value||0);
if(!v){v=(Number(x.quantity||1))*(Number(x.unit_price||x.price||0));}
return v||0;
}
function sname(x){
return x.name||x.shop_name||x.shopname||x.title||x.owner_name||'Shop';
}
function nm(i){
for(var j=0;j<H.length;j++){if(H[j].id==i){return sname(H[j]);}}
return '?';
}
function esc(t){return String(t).replace(/'/g,"\\'")}
function show(){
var t=0;
S.forEach(function(x){t+=amt(x);});
document.getElementById('k').innerHTML=
'✅ '+S.length+' sales | '+H.length+' shops | UGX '+
t.toLocaleString()+' | profit ~UGX '+
Math.round(t*0.25).toLocaleString();
var s='';
S.slice(0,20).forEach(function(x){
s+='<p>• '+nm(x.shop_id)+' - '+
(x.product_name||'Item')+' x'+(x.quantity||1)+
' - UGX '+amt(x).toLocaleString()+
' <button onclick="dR(\''+x.id+'\')">Del</button></p>';
});
document.getElementById('s').innerHTML=s||'<p>No sales yet.</p>';
var h='';
H.forEach(function(x){
h+='<p>• '+sname(x)+' ('+(x.owner_name||'')+') '+
'<button onclick="dS(\''+x.id+'\',\''+esc(sname(x))+'\')">Remove</button></p>';
});
document.getElementById('h').innerHTML=h||'<p>No shops yet.</p>';
document.getElementById('m').innerText='✅ LIVE v9';
}
async function dS(i,n){
if(!confirm('Remove '+n+' and its data?'))return;
await sb.from('sales').delete().eq('shop_id',i);
await sb.from('expenses').delete().eq('shop_id',i);
var r=await sb.from('shops').delete().eq('id',i);
alert(r.error?r.error.message:'✅ removed');
location.reload();
}
async function dR(i){
if(!confirm('Delete this sale?'))return;
var r=await sb.from('sales').delete().eq('id',i);
alert(r.error?r.error.message:'✅ deleted');
location.reload();
}
</script>
</body>
</html>
